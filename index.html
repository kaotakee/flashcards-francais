<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Français</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .flashcard {
            perspective: 1000px;
            cursor: pointer;
            height: 400px;
            margin-bottom: 20px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            font-size: 1.5em;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #d4af37;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #001a4d 0%, #003d99 100%);
            color: #fff;
            z-index: 2;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4c1 100%);
            color: #001a4d;
            transform: rotateY(180deg);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 20px;
        }

        button {
            background-color: #d4af37;
            color: #001a4d;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
        }

        button:hover {
            background-color: #f4e4c1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .counter {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            padding: 10px 20px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            min-width: 100px;
        }

        .hint {
            color: #d4af37;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Français</h1>
        
        <div class="flashcard" id="flashcard">
            <div class="flashcard-inner">
                <div class="flashcard-front" id="front"></div>
                <div class="flashcard-back" id="back"></div>
            </div>
        </div>

        <div class="navigation">
            <button id="prevBtn" onclick="previousCard()">← Précédent</button>
            <div class="counter">
                <span id="current">1</span> / <span id="total">4</span>
            </div>
            <button id="nextBtn" onclick="nextCard()">Suivant →</button>
        </div>

        <div class="hint">💡 Clique sur la carte pour voir la réponse</div>
    </div>

    <script>
        const flashcards = [
            {
                recto: "Qu'est-ce qu'une métaphore ?",
                verso: "Une comparaison sans outil de comparaison. Exemple: \"Cet homme est un lion.\""
            },
            {
                recto: "Comparaison sans outil de comparaison. Exemple: \"Cet homme est un lion.\"",
                verso: "Une métaphore"
            },
            {
                recto: "Qu'est-ce qu'une litote ?",
                verso: "Dire moins pour faire comprendre plus. Exemple: \"ce n'est pas mauvais\""
            },
            {
                recto: "Dire moins pour faire comprendre plus. Exemple: \"ce n'est pas mauvais\"",
                verso: "Une litote"
            }
        ];

        let currentIndex = 0;

        function displayCard() {
            const card = flashcards[currentIndex];
            document.getElementById('front').textContent = card.recto;
            document.getElementById('back').textContent = card.verso;
            document.getElementById('current').textContent = currentIndex + 1;
            document.getElementById('total').textContent = flashcards.length;
            document.getElementById('flashcard').classList.remove('flipped');
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        displayCard();
    </script>
</body>
</html>
